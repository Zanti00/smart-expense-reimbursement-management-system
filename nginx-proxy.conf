server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=30s;

    # Frontend
    location /serms/ {
        set $upstream_serms_web http://serms_web:5002;
        proxy_pass $upstream_serms_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Gateway
    location /api/serms/ {
        rewrite ^/api/serms/(.*)$ /api/$1 break;
        set $upstream_serms_api http://serms_api:8000;
        proxy_pass $upstream_serms_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
