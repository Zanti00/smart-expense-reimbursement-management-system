services:
  mysql:
    image: mysql:8.0
    container_name: serms_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: serms
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: secret
      MYSQL_USER: serms_user
    ports:
      - "3306:3306"
    volumes:
      - serms_mysql_data:/var/lib/mysql
    networks:
      - serms_network

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: serms_api
    restart: unless-stopped
    volumes:
      - ./apps/api:/var/www
      - ../capstone-auth-module/auth-service/storage/oauth-public.key:/var/www/storage/oauth-public.key:ro
    depends_on:
      - mysql
    networks:
      - serms_network
      - shared-capstone-network
    environment:
      - DB_HOST=mysql
      - DB_DATABASE=serms
      - DB_USERNAME=root
      - DB_PASSWORD=secret
      - REDIS_HOST=auth-redis
      - CACHE_STORE=redis
      - JWT_PUBLIC_KEY_PATH=/var/www/storage/oauth-public.key
      - PRS_WEBHOOK_SECRET=ucg6JjRwygbqcZrK+8sSBO8cnO2arZ+XZzonNIo11kA=

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: serms_web
    restart: unless-stopped
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    networks:
      - serms_network
      - shared-capstone-network
    command: npm run dev -- --host --port 5002

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: serms_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - PMA_USER=root
      - PMA_PASSWORD=secret
    depends_on:
      - mysql
    networks:
      - serms_network

networks:
  serms_network:
    driver: bridge
  shared-capstone-network:
    external: true

volumes:
  serms_mysql_data:
