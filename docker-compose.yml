services:
  mysql:
    image: mysql:8.0
    container_name: serms_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: serms
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: secret
      MYSQL_USER: serms_user
    ports:
      - "3306:3306"
    volumes:
      - serms_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "serms_user",
          "-psecret",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - serms_network

  php:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: serms_php
    restart: unless-stopped
    volumes:
      - ./apps/api:/var/www
      - serms_api_vendor:/var/www/vendor
      - serms_api_bootstrap_cache:/var/www/bootstrap/cache
      - ../capstone-auth-module/auth-service/storage/oauth-public.key:/var/www/storage/oauth-public.key:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - serms_network
      - shared-capstone-network
    environment:
      - DB_HOST=mysql
      - DB_DATABASE=serms
      - DB_USERNAME=root
      - DB_PASSWORD=secret
      - REDIS_HOST=auth-redis
      - CACHE_STORE=redis
      - SERMS_SERVICE_ROLE=api
      - JWT_PUBLIC_KEY_PATH=/var/www/storage/oauth-public.key
      - PRS_REIMBURSEMENT_API_KEY=prs-serms-local-service-key
      - PRS_REIMBURSEMENT_STATUS_API_URL=http://prs_api:8000/api/integrations/serms/reimbursement-status
      - PRS_REIMBURSEMENT_STATUS_API_KEY=serms-prs-local-service-key
      - PRS_REIMBURSEMENT_STATUS_API_TIMEOUT=10

  api:
    image: nginx:alpine
    container_name: serms_api
    restart: unless-stopped
    volumes:
      - ./apps/api:/var/www
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - serms_network
      - shared-capstone-network

  api_queue:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: serms_api_queue
    restart: unless-stopped
    volumes:
      - ./apps/api:/var/www
      - serms_api_vendor:/var/www/vendor
      - serms_api_bootstrap_cache:/var/www/bootstrap/cache
      - ../capstone-auth-module/auth-service/storage/oauth-public.key:/var/www/storage/oauth-public.key:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - serms_network
      - shared-capstone-network
    environment:
      - DB_HOST=mysql
      - DB_DATABASE=serms
      - DB_USERNAME=root
      - DB_PASSWORD=secret
      - REDIS_HOST=auth-redis
      - CACHE_STORE=redis
      - SERMS_SERVICE_ROLE=worker
      - JWT_PUBLIC_KEY_PATH=/var/www/storage/oauth-public.key
      - PRS_REIMBURSEMENT_API_KEY=prs-serms-local-service-key
      - PRS_REIMBURSEMENT_STATUS_API_URL=http://prs_api:8000/api/integrations/serms/reimbursement-status
      - PRS_REIMBURSEMENT_STATUS_API_KEY=serms-prs-local-service-key
      - PRS_REIMBURSEMENT_STATUS_API_TIMEOUT=10
    command: php artisan queue:work --sleep=3 --tries=3

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: serms_web
    restart: unless-stopped
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    networks:
      - serms_network
      - shared-capstone-network
    command: npm run dev -- --host --port 5002

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: serms_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - PMA_USER=root
      - PMA_PASSWORD=secret
    depends_on:
      - mysql
    networks:
      - serms_network

  nginx-proxy:
    image: nginx:alpine
    container_name: serms-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf
    networks:
      - serms_network
      - shared-capstone-network

networks:
  serms_network:
    driver: bridge
  shared-capstone-network:
    external: true

volumes:
  serms_mysql_data:
  serms_api_vendor:
  serms_api_bootstrap_cache:
